[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndh-surrealism"
version = "1.0.0"
description = "Automated physicalization pipeline converting latent-space hallucination operators into robotic canvas maneuvers."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyserial>=3.5",
    "lhguard @ git+https://github.com",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
