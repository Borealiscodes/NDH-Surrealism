name: NDH-Surrealism Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Development Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Audit Linting and Code Formatting Compliance
      run: |
        python -m black --check src/ tests/

    - name: Execute Geometric Boundary Assertion Tests
      run: |
        python -m pytest tests/

    - name: Initialize Lean 4 Theorem Verification Stub
      run: |
        if command -v lake > /dev/null; then
          lake build
        else
          echo "[*] Lean 4 engine not hosted on native runner. Bypassing formal proof compiler check."
        fi
